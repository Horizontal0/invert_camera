<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Invert Cam</title>
<style>
  :root { --fg: #f2f2f2; --dim: #8a8a8a; --accent: #ff453a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }

  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #view { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #src { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 32px; text-align: center; color: var(--dim); }
  #msg.show { display: flex; }

  #timer { position: fixed; top: calc(env(safe-area-inset-top) + 14px); left: 50%; transform: translateX(-50%);
    padding: 4px 12px; border-radius: 999px; background: rgba(0,0,0,.55); font-variant-numeric: tabular-nums;
    display: none; align-items: center; gap: 8px; }
  #timer.show { display: flex; }
  #timer::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  #bottom { position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 20px calc(env(safe-area-inset-bottom) + 18px);
    background: linear-gradient(transparent, rgba(0,0,0,.7)); }

  #tray { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; min-height: 0; }
  #tray:empty { display: none; }
  .item { position: relative; flex: 0 0 auto; width: 56px; height: 56px; border-radius: 8px; overflow: hidden;
    border: 1px solid #333; background: #111; padding: 0; cursor: pointer; }
  .item img, .item video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .item span { position: absolute; right: 3px; bottom: 3px; font-size: 10px; padding: 1px 4px;
    border-radius: 4px; background: rgba(0,0,0,.7); }

  #bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  #modes { display: flex; gap: 4px; justify-self: start; background: rgba(255,255,255,.1); border-radius: 999px; padding: 3px; }
  #modes button { border: 0; background: none; color: var(--dim); padding: 6px 12px; border-radius: 999px; font: inherit; cursor: pointer; }
  #modes button.on { background: var(--fg); color: #000; }

  #shutter { width: 68px; height: 68px; border-radius: 50%; border: 3px solid var(--fg); background: none;
    padding: 0; display: grid; place-items: center; cursor: pointer; }
  #shutter i { display: block; width: 52px; height: 52px; border-radius: 50%; background: var(--fg); transition: all .15s; }
  #shutter.video i { background: var(--accent); }
  #shutter.rec i { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); }
  #shutter:active i { transform: scale(.92); }

  #flip { justify-self: end; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255,255,255,.1); color: var(--fg); display: grid; place-items: center; }
  #flip svg { width: 22px; height: 22px; }
  button:disabled { opacity: .4; }
</style>
</head>
<body>
  <div id="stage"><canvas id="view"></canvas></div>
  <video id="src" playsinline muted autoplay></video>
  <div id="msg"></div>
  <div id="timer">00:00</div>

  <div id="bottom">
    <div id="tray"></div>
    <div id="bar">
      <div id="modes">
        <button id="m-photo" class="on">Photo</button>
        <button id="m-video">Video</button>
      </div>
      <button id="shutter" aria-label="Capture"><i></i></button>
      <button id="flip" aria-label="Switch camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>
        </svg>
      </button>
    </div>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const src = $('src'), view = $('view'), ctx = view.getContext('2d', { alpha: false });
  const msg = $('msg'), timerEl = $('timer'), tray = $('tray');
  const shutter = $('shutter'), flip = $('flip');

  let facing = 'environment';
  let mode = 'photo';
  let camStream = null;
  let recorder = null, recChunks = [], recStart = 0, recTick = 0, micStream = null;
  let counter = 0;

  const isTouch = matchMedia('(pointer: coarse)').matches;

  function showMsg(t) { msg.textContent = t || ''; msg.classList.toggle('show', !!t); }

  // ---- camera ----
  async function startCamera() {
    if (!navigator.mediaDevices?.getUserMedia) {
      showMsg('Camera access needs HTTPS and a modern browser.');
      return;
    }
    stopCamera();
    try {
      camStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      src.srcObject = camStream;
      await src.play();
      showMsg('');
    } catch (e) {
      showMsg(e.name === 'NotAllowedError'
        ? 'Camera permission denied. Allow it in your browser settings and reload.'
        : 'Could not start the camera: ' + e.message);
    }
  }
  function stopCamera() {
    camStream?.getTracks().forEach(t => t.stop());
    camStream = null;
  }

  // ---- render loop: draw frame, then invert with a white "difference" fill ----
  function draw() {
    if (src.readyState >= 2 && src.videoWidth) {
      if (view.width !== src.videoWidth || view.height !== src.videoHeight) {
        view.width = src.videoWidth; view.height = src.videoHeight;
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(src, 0, 0, view.width, view.height);
      ctx.globalCompositeOperation = 'difference';
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, view.width, view.height);
      ctx.globalCompositeOperation = 'source-over';
    }
    requestAnimationFrame(draw);
  }

  // ---- saving ----
  async function save(blob, name) {
    const file = new File([blob], name, { type: blob.type });
    if (isTouch && navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }

  function addToTray(blob, name, kind) {
    const url = URL.createObjectURL(blob);
    const b = document.createElement('button');
    b.className = 'item';
    b.title = 'Tap to save';
    if (kind === 'photo') { const im = new Image(); im.src = url; b.appendChild(im); }
    else { const v = document.createElement('video'); v.src = url + '#t=0.1'; v.muted = true; v.preload = 'metadata'; v.playsInline = true; b.appendChild(v); }
    const tag = document.createElement('span'); tag.textContent = 'Save'; b.appendChild(tag);
    b.onclick = () => save(blob, name);
    tray.prepend(b);
  }

  const stamp = () => { counter++; return new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '_' + counter; };

  // ---- photo ----
  function takePhoto() {
    view.toBlob(blob => {
      if (!blob) return;
      const name = `invert_${stamp()}.jpg`;
      addToTray(blob, name, 'photo');
      save(blob, name);
    }, 'image/jpeg', 0.95);
  }

  // ---- video ----
  function pickMime() {
    const c = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus',
               'video/webm;codecs=vp8,opus', 'video/webm'];
    return c.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
  }

  async function startRecording() {
    if (!window.MediaRecorder) { showMsg('Recording is not supported in this browser.'); return; }
    const out = view.captureStream(30);
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      micStream.getAudioTracks().forEach(t => out.addTrack(t));
    } catch { micStream = null; } // record silent video if mic is denied

    const mime = pickMime();
    recChunks = [];
    recorder = new MediaRecorder(out, mime ? { mimeType: mime, videoBitsPerSecond: 8_000_000 } : undefined);
    recorder.ondataavailable = e => e.data.size && recChunks.push(e.data);
    recorder.onstop = () => {
      const type = recorder.mimeType || mime || 'video/webm';
      const blob = new Blob(recChunks, { type });
      const ext = type.includes('mp4') ? 'mp4' : 'webm';
      const name = `invert_${stamp()}.${ext}`;
      addToTray(blob, name, 'video');
      save(blob, name);
      micStream?.getTracks().forEach(t => t.stop()); micStream = null;
    };
    recorder.start(1000);
    recStart = Date.now();
    shutter.classList.add('rec'); flip.disabled = true;
    $('m-photo').disabled = $('m-video').disabled = true;
    timerEl.classList.add('show');
    recTick = setInterval(() => {
      const s = Math.floor((Date.now() - recStart) / 1000);
      timerEl.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }, 250);
    timerEl.textContent = '00:00';
  }

  function stopRecording() {
    recorder?.state !== 'inactive' && recorder.stop();
    clearInterval(recTick);
    shutter.classList.remove('rec'); flip.disabled = false;
    $('m-photo').disabled = $('m-video').disabled = false;
    timerEl.classList.remove('show');
  }

  // ---- UI wiring ----
  function setMode(m) {
    mode = m;
    $('m-photo').classList.toggle('on', m === 'photo');
    $('m-video').classList.toggle('on', m === 'video');
    shutter.classList.toggle('video', m === 'video');
  }
  $('m-photo').onclick = () => setMode('photo');
  $('m-video').onclick = () => setMode('video');
  shutter.onclick = () => {
    if (mode === 'photo') return takePhoto();
    recorder && recorder.state === 'recording' ? stopRecording() : startRecording();
  };
  flip.onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCamera(); };

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && (!camStream || !camStream.active) && !(recorder && recorder.state === 'recording')) startCamera();
  });

  startCamera();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
